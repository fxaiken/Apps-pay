name: Aura build

on:
  push:
    branches: [claude-chat]
  workflow_dispatch:

concurrency:
  group: claude-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icon
        # Cosmetic only: keep the default icon rather than fail the build.
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#05040a' --iconBackgroundColorDark '#05040a'

      - name: Rising version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Re-sign with Aura's own key so every release installs over the previous one.
      # The key lives only in the Actions cache (never in the repo); the release notes
      # record its fingerprint so a key change is visible.
      - name: Restore Aura signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.aura-signing
          key: aura-signing-v2

      - name: Sign APK with the Aura key
        id: sign
        run: |
          mkdir -p ~/.aura-signing
          KS=~/.aura-signing/aura.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass aura-signing -alias aura \
              -keypass aura-signing -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aura,O=Aura,C=PT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:aura-signing --ks-key-alias aura --key-pass pass:aura-signing \
            --out aura.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs aura.apk | tee certs.txt
          echo "fingerprint=$(grep -m1 'SHA-256' certs.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: aura.apk
          archive: false
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: claude-chat-v${{ github.run_number }}
          name: Aura (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: aura.apk
          body: |
            Assinatura (SHA-256): ${{ steps.sign.outputs.fingerprint }} · chave reutilizada: ${{ steps.signing-cache.outputs.cache-hit == 'true' && 'sim' || 'não (nova)' }}

            Aura — assistente pessoal com o modelo Claude (Anthropic), para Android.
            Descarregue `aura.apk`, abra-o no telemóvel e configure a sua chave da API da Anthropic nas definições.
            A partir desta versão, as atualizações instalam por cima. Se tiver uma versão mais antiga instalada, desinstale-a primeiro.

  web:
    name: Web site (gh-pages branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # Served by GitHub Pages once Settings > Pages > "Deploy from a branch" points at gh-pages / (root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish Aura web ${{ github.sha }}"
