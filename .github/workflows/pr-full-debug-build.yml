name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite]
  push:
    branches: [android-apple-tv-design]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build fullDebug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace 2>&1 | tee build.log

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      # Re-sign with FRAME's own key so every release installs over the previous one.
      # The key lives only in the Actions cache (never in the repo); the release notes
      # record its fingerprint so a key change is visible.
      - name: Restore FRAME signing key
        if: github.event_name == 'push'
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.frame-signing
          key: frame-signing-v2

      - name: Sign APK with the FRAME key
        if: github.event_name == 'push'
        id: sign
        run: |
          mkdir -p ~/.frame-signing
          KS=~/.frame-signing/frame.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass frame-signing -alias frame \
              -keypass frame-signing -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FRAME,O=FRAME,C=PT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:frame-signing --ks-key-alias frame --key-pass pass:frame-signing \
            --out frame.apk androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          "$BT/apksigner" verify --print-certs frame.apk | tee certs.txt
          echo "fingerprint=$(grep -m1 'SHA-256' certs.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frame-v${{ github.run_number }}
          name: FRAME (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: frame.apk
          body: |
            Assinatura (SHA-256): ${{ steps.sign.outputs.fingerprint }} · chave reutilizada: ${{ steps.signing-cache.outputs.cache-hit == 'true' && 'sim' || 'não (nova)' }}

            FRAME para Android: design ao estilo Apple TV com botões de vidro.
            Baseado no Nuvio Mobile (GPL-3.0); o código-fonte está neste repositório.
            É uma app nova: pode ficar instalada ao lado do Nuvio.

      # Job logs are not always reachable, so a failed push build publishes its compiler
      # errors as a pre-release note that can be read through the releases API.
      - name: Collect build errors
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          {
            echo "A compilação falhou no commit ${GITHUB_SHA}."
            echo
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | head -120 || true
            echo '```'
          } > build-errors.md

      - name: Publish build errors
        if: failure() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frame-build-failed-${{ github.run_number }}
          name: FRAME — erro de compilação (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: build-errors.md
